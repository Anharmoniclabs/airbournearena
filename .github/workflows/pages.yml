# Publishes the standalone game to GitHub Pages.
#
# The game is one self-contained HTML file plus an assets folder, so the site is
# just Airbourne-Arena/ lifted to the site root. Every asset reference in the
# game is relative, which is what lets it work unchanged at a project subpath
# like /airbournearena/ as well as straight off a local disk.
#
# That one file is assembled from Airbourne-Arena/src/ and committed, so this
# workflow publishes it as-is rather than building it. What it does check is that
# the committed file is what src/ actually produces — a hand-edit of the
# generated file must not be able to reach the site.
#
# The Next/vinext project under source/ is deliberately NOT deployed here — it
# targets Cloudflare Workers and needs a server. Pages serves the static game.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Airbourne-Arena/index.html"
      - "Airbourne-Arena/src/**"
      - "Airbourne-Arena/manifest.webmanifest"
      - "Airbourne-Arena/assets/**"
      - "Airbourne-Arena/source/scripts/build-game.sh"
      - "Airbourne-Arena/source/tests/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Let a running deploy finish rather than cancelling it: a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the game is intact
        working-directory: Airbourne-Arena/source
        # Pure bash and node:test, no dependencies — nothing is installed yet at
        # this point. --check comes first and does not write: the file about to be
        # published has to be exactly what src/ assembles to, so a hand-edit of
        # the generated file fails the deploy instead of shipping and then being
        # reverted by the next rebuild.
        #
        # The rest verifies the served copy is in sync, that all asset paths are
        # relative, and that every referenced asset actually exists. New art
        # landing in only one of the two asset folders has already shipped a game
        # with missing textures once.
        run: |
          bash scripts/build-game.sh --check
          bash scripts/sync-game.sh
          node --test tests/game-html.test.mjs tests/game-build.test.mjs

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site _site/Airbourne-Arena
          cp Airbourne-Arena/index.html _site/
          cp Airbourne-Arena/manifest.webmanifest _site/
          cp -r Airbourne-Arena/assets _site/assets
          # Preserve the original public URL used by existing players and
          # bookmarks. This used to be a second full copy of the game and its
          # asset tree, which doubled the artifact to keep one legacy path
          # alive. A stub costs half a kilobyte and does the same job — the
          # game is served once, at the project root.
          cat > _site/Airbourne-Arena/index.html <<'STUB'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#05070d">
          <title>AIRBOURNE ARENA — CASE RUN 4v4</title>
          <link rel="canonical" href="../">
          <meta http-equiv="refresh" content="0; url=../">
          <style>
            html,body{height:100%;margin:0;background:#05070d;color:#dff3ff;
              font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
            main{height:100%;display:grid;place-content:center;text-align:center;gap:14px;padding:24px}
            h1{margin:0;font-size:13px;letter-spacing:.34em;font-weight:600;color:#6fe3d0}
            p{margin:0;font-size:11px;letter-spacing:.16em;color:rgba(223,243,255,.45)}
            a{color:#6fe3d0}
          </style>
          </head>
          <body>
          <main>
            <h1>AIRBOURNE ARENA</h1>
            <p>THE GAME MOVED UP ONE LEVEL&hellip;</p>
            <p><a href="../">Open the game</a> if this does not move on its own.</p>
          </main>
          <script>
            /* replace() rather than assignment: the back button should leave the
               site instead of bouncing off this page back into the game */
            location.replace('../');
          </script>
          </body>
          </html>
          STUB
          # Without this, Jekyll processes the tree and silently drops anything
          # beginning with an underscore.
          touch _site/.nojekyll

      - name: Verify every referenced asset made it into the artifact
        run: |
          set -euo pipefail
          missing=0
          for ref in $(grep -o 'assets/[a-zA-Z0-9._/-]*' _site/index.html | sort -u); do
            if [ ! -f "_site/$ref" ]; then
              echo "::error::missing from published site: $ref"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "published $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
